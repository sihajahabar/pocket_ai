{% extends "base.html" %}{% block content %}<section class="planner"><div class="box"><small>JEWELRY PLANNER</small><h1>Jewelry Planner</h1><p>Use occasion, style, outfit color and an optional image.</p><form id="jewelryForm"><label>Budget (₹)<input id="budget" name="budget" type="number" min="1" required></label><label>Occasion<input id="occasion" name="occasion" required></label><label>Style<select id="style" name="style"><option>Elegant</option><option>Traditional</option><option>Minimal</option><option>Trendy</option></select></label><label>Outfit color<input id="outfit_color" name="outfit_color"></label><label>Preferences<textarea id="preferences" name="preferences"></textarea></label><label>Outfit image (optional)<input id="outfit" name="outfit" type="file" accept="image/png,image/jpeg,image/webp"></label><button class="cta">Generate Recommendations ✦</button></form></div><div class="box result"><div id="loading" class="hide">Thinking…</div><div id="result">Your recommendations will appear here.</div></div></section>{% endblock %}{% block scripts %}<script>setupJewelry()</script>{% endblock %}
